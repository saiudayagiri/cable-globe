server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # .mjs must be served as JavaScript or browsers refuse to start the
    # MapLibre module worker (2D map renders black otherwise). A server-level
    # types block replaces the inherited map, so re-include the defaults too.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    gzip on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml application/x-protobuf;
    gzip_min_length 1024;

    # hashed build assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # data, textures, audio, fonts, vendored worker: cache but allow refresh
    location ~ ^/(data|textures|audio|fonts|vendor)/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

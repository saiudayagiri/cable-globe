# Cable Atlas on Kubernetes / Rancher.
#   1. Build & push:  docker build -t <registry>/cable-atlas:v1 . && docker push <registry>/cable-atlas:v1
#   2. Edit image + host below, then:  kubectl apply -f deploy/k8s.yaml
# No GPU resources needed — rendering happens in the visitor's browser.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cable-atlas
  labels: { app: cable-atlas }
spec:
  replicas: 2
  selector:
    matchLabels: { app: cable-atlas }
  template:
    metadata:
      labels: { app: cable-atlas }
    spec:
      # if the ghcr.io package is private, create the secret (see deploy notes
      # in README) and uncomment:
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/saiudayagiri/cable-atlas:v1
          imagePullPolicy: Always # v1 is a moving tag; never reuse a stale cache
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cable-atlas
spec:
  selector: { app: cable-atlas }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cable-atlas
  annotations:
    # for cert-manager TLS, uncomment and set your issuer:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: cable-atlas.example.com # <- your host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cable-atlas
                port: { number: 80 }
  # tls:
  #   - hosts: [cable-atlas.example.com]
  #     secretName: cable-atlas-tls
